<!doctype html>
<html lang="fr" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Icônes : chemins ABSOLUS à la source, car c'est la seule forme que Vite
         sait réécrire selon `base` (vérifié : `--base=/boutique/` produit bien
         « /boutique/favicon.ico »). Les écrire relatifs les soustrairait à ce
         mécanisme ET les casserait sur les routes profondes de la SPA, où
         « ./favicon.ico » se résoudrait contre /produits/xyz/. -->
    <!-- Le .ico reste déclaré en premier : c'est le seul repli universel, et
         c'est aussi ce que les navigateurs vont chercher à la racine sans lien. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignore le manifeste et le SVG : il lui faut son PNG opaque. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0a0d12" />
    <script>
      (function () {
        try {
          var b = window.__SITE_SETTINGS_BOOTSTRAP__;
          var savedSettings = null;
          try {
            var raw = localStorage.getItem("katech_site_settings");
            if (raw) savedSettings = JSON.parse(raw);
          } catch (e) {}
          var s = b || savedSettings || {};

          // 1. Nom du magasin
          var n = s.storeName || localStorage.getItem("katech_site_settings_name");
          if (n && n.trim()) {
            document.title =
              n + " — Plateforme E-Commerce, Vitrines tous produits et tous commerces";
          }

          // 2. Thème par défaut / préférence utilisateur (0 ms, zéro FOUC)
          var userTheme = localStorage.getItem("ka-theme");
          var themeToApply = userTheme || s.defaultTheme || "dark";
          var isLight =
            themeToApply === "light" ||
            (themeToApply === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          var root = document.documentElement;
          root.classList.toggle("light", isLight);
          root.classList.toggle("dark", !isLight);
          root.style.colorScheme = isLight ? "light" : "dark";

          // 3. Nuances chromatiques (Primaire, Secondaire, Accent)
          if (s.primaryColor && s.primaryColor.trim()) {
            root.style.setProperty("--primary", s.primaryColor);
            root.style.setProperty("--ring", s.primaryColor);
            root.style.setProperty("--primary-glow", s.primaryColor);
          }
          if (s.secondaryColor && s.secondaryColor.trim()) {
            root.style.setProperty("--secondary", s.secondaryColor);
          }
          if (s.accentColor && s.accentColor.trim()) {
            root.style.setProperty("--accent", s.accentColor);
          }

          // 4. Géométrie & Arrondi (Border Radius)
          if (s.borderRadius) {
            var radiusMap = { sharp: "0px", modern: "0.375rem", soft: "0.75rem", pill: "1.25rem" };
            if (radiusMap[s.borderRadius]) {
              root.style.setProperty("--radius", radiusMap[s.borderRadius]);
            }
          }

          // 5. Typographie & Polices
          if (s.fontFamily) {
            var fontMap = {
              inter: "'Inter', system-ui, sans-serif",
              outfit: "'Outfit', system-ui, sans-serif",
              jakarta: "'Plus Jakarta Sans', system-ui, sans-serif",
              poppins: "'Poppins', system-ui, sans-serif",
              cairo: "'Cairo', system-ui, sans-serif",
              system: "system-ui, -apple-system, sans-serif",
            };
            if (fontMap[s.fontFamily]) {
              root.style.setProperty("--font-sans", fontMap[s.fontFamily]);
              root.style.setProperty("--font-display", fontMap[s.fontFamily]);
            }
          }

          // 6. Favicon dynamique
          if (s.faviconUrl && s.faviconUrl.trim()) {
            var link = document.querySelector('link[rel="icon"]');
            if (link) {
              var fUrl = s.faviconUrl.trim();
              if (!fUrl.startsWith("http") && !fUrl.startsWith("/")) {
                fUrl = "/" + fUrl;
              }
              link.href = fUrl;
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>
      StacGate Platform — Plateforme E-Commerce, Vitrines tous produits et tous commerces
    </title>
    <meta
      name="description"
      content="StacGate Platform : plateforme e-commerce et vitrine multimarques pour tous produits et tous commerces avec livraison et suivi en temps réel."
    />
    <meta name="author" content="StacGate Platform" />
    <meta
      property="og:title"
      content="StacGate Platform — Plateforme E-Commerce, Vitrines tous produits et tous commerces"
    />
    <meta
      property="og:description"
      content="Plateforme e-commerce et vitrine multimarques pour tous produits et tous commerces."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StacGate Platform" />
    <meta property="og:locale" content="fr_DZ" />
    <!-- WhatsApp — canal de vente principal en Algérie — n'accepte QUE des URL
         absolues pour og:image : un chemin relatif ne produit aucune vignette.
         Les URL ci-dessous sont des valeurs de REPLI : elles restent correctes
         sur le domaine de production (katech.dz). Quand le site est servi par
         public/index.php (cas normal), PHP les réécrit à la volée avec l'origine
         réelle de la requête (protocole + hôte), ce qui les rend portables sur
         tout hébergement ou sous-domaine sans reconstruire. -->
    <meta property="og:url" content="https://katech.dz/" />
    <meta property="og:image" content="https://katech.dz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="StacGate Platform — Plateforme E-Commerce, Vitrines tous produits et tous commerces"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StacGate Platform" />
    <meta
      name="twitter:description"
      content="Plateforme e-commerce et vitrine multimarques pour tous produits et tous commerces."
    />
    <meta name="twitter:image" content="https://katech.dz/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "StacGate Platform",
        "url": "https://katech.dz/",
        "logo": "https://katech.dz/og-image.png",
        "description": "Plateforme e-commerce et vitrine multimarques pour tous produits et tous commerces.",
        "areaServed": "DZ"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
